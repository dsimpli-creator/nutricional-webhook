name: Build

# Nutricional Webhook: testes e APK assinado a cada envio para a main; a cada tag vX.Y.Z,
# publica o APK como release (é de lá que o Nutricional busca o arquivo).

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ID: br.com.virachef.nutricional.webhook
  APK: app/build/outputs/apk/foss/release/app-foss-release.apk

jobs:
  build:
    name: Testes e APK assinado
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Código
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache do Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Permissão do gradlew
        run: chmod +x gradlew

      - name: Testes
        run: ./gradlew :app:testFossDebugUnitTest --stacktrace

      - name: Chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta o segredo KEYSTORE_BASE64 (a chave de assinatura)."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > app/release.jks

      - name: APK assinado
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleFossRelease --stacktrace

      - name: Apagar a chave
        if: always()
        run: rm -f app/release.jks

      - name: Conferir o APK
        run: |
          set -euo pipefail
          TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          "$TOOLS/apksigner" verify --print-certs "$APK" | grep -E "DN:|SHA-256"
          BADGING="$("$TOOLS/aapt2" dump badging "$APK")"
          PACKAGE="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)"
          VERSION="$(printf '%s\n' "$BADGING" | sed -n "s/^package:.* versionName='\([^']*\)'.*/\1/p" | head -n 1)"
          echo "Pacote: $PACKAGE · versão: $VERSION"
          if [ "$PACKAGE" != "$APP_ID" ]; then
            echo "::error::O APK saiu com o pacote $PACKAGE; o esperado é $APP_ID."
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::A tag $GITHUB_REF_NAME não confere com a versão $VERSION do app (app/build.gradle.kts)."
            exit 1
          fi
          cp "$APK" nutricional-webhook.apk
          sha256sum nutricional-webhook.apk | tee nutricional-webhook.apk.sha256
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: nutricional-webhook
          path: |
            nutricional-webhook.apk
            nutricional-webhook.apk.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publicar a versão
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Baixar o APK
        uses: actions/download-artifact@v4
        with:
          name: nutricional-webhook

      - name: Criar a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "APK do Nutricional Webhook ${GITHUB_REF_NAME#v}, assinado."
            echo
            echo "Instale pelo Nutricional (⚙ Perfil e metas → Envio automático de saúde) ou baixe o arquivo abaixo."
            echo
            echo '```'
            cat nutricional-webhook.apk.sha256
            echo '```'
          } > notas.md
          gh release create "$GITHUB_REF_NAME" nutricional-webhook.apk nutricional-webhook.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Nutricional Webhook ${GITHUB_REF_NAME#v}" \
            --notes-file notas.md
